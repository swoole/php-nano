name: php-nano tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  upstream-audit:
    name: php-src divergence audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read recorded upstream metadata
        id: upstream
        run: php tools/upstream.php metadata >> "$GITHUB_OUTPUT"

      - name: Download recorded php-src baseline
        env:
          PHP_SRC_URL: ${{ steps.upstream.outputs.archive_url }}
          PHP_SRC_SHA256: ${{ steps.upstream.outputs.archive_sha256 }}
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/php-src.tar.gz" \
            "$PHP_SRC_URL"
          echo "$PHP_SRC_SHA256  $RUNNER_TEMP/php-src.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/php-src"
          tar -xzf "$RUNNER_TEMP/php-src.tar.gz" \
            -C "$RUNNER_TEMP/php-src" --strip-components=1

      - name: Audit vendored php-src changes
        run: php tools/upstream.php audit --source="$RUNNER_TEMP/php-src"

  native-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure test build
        run: cmake -S . -B build/tests -DCMAKE_BUILD_TYPE=Release

      - name: Build runtime and smoke test
        run: cmake --build build/tests --parallel 4

      - name: Run smoke test
        run: ctest --test-dir build/tests --output-on-failure

  ios-compile:
    name: iOS arm64
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile php-nano for iPhoneOS arm64
        run: |
          cmake -S . -B build/ios \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DPHP_NANO_BUILD_SMOKE=OFF
          cmake --build build/ios --target php-nano-runtime --parallel 4

  android-compile:
    name: Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile php-nano for Android arm64-v8a
        run: |
          cmake -S . -B build/android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DPHP_NANO_BUILD_SMOKE=OFF
          cmake --build build/android --target php-nano-runtime --parallel 4

  wasi-smoke:
    name: WASI Preview 2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install WASI SDK 34
        env:
          WASI_SDK_ARCHIVE: wasi-sdk-34.0-x86_64-linux.tar.gz
          WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$WASI_SDK_ARCHIVE" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/$WASI_SDK_ARCHIVE"
          echo "$WASI_SDK_SHA256  $RUNNER_TEMP/$WASI_SDK_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/$WASI_SDK_ARCHIVE" \
            -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"

      - name: Install Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: 47.0.3

      - name: Build WASI runtime and smoke test
        run: |
          cmake -S . -B build/wasi \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$WASI_SDK_PATH/share/cmake/wasi-sdk-p2.cmake"
          cmake --build build/wasi --parallel 4

      - name: Run WASI smoke test
        run: wasmtime build/wasi/php-nano-smoke.wasm nano-wasi-argument
